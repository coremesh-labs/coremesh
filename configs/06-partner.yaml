# Fachmodul Geschäftspartner (externes Plugin, eigenes Go-Modul unter cmd/plugins/partner).
plugins:
  partner:
    version: 0.15.1
    databases:
      main: { access: write }        # Tabellen partner__* via DBSchema.Init (+ Seeds)
    settings:
      modules:
        businesspartner:
          short_name_unique: true    # Kurzname (Matchcode) eindeutig; false = Dubletten erlaubt
          valid_from_days_back: 365  # Gültig ab neuer Partner ohne Angabe: heute minus Tage (Prüfungen zu früheren Daten)
