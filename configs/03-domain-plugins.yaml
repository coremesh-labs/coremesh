# Domain-Plugins (eigene Prozesse via HashiCorp go-plugin).
plugins:
  hello:
    version: 0.3.0
    # sha256: "<64 hex>"   # Pflicht für Downloads; lokal empfohlen (Prüfung bei jedem Start)
