# Console-API (CLI <-> Plugin console): proto/console -> pkg/consoleapi.
# Öffentlich, damit auch andere Clients als cmd/console sie nutzen können.
version: v2
inputs:
  - directory: proto
    paths:
      - proto/console
plugins:
  - local: protoc-gen-go
    out: pkg/consoleapi
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: pkg/consoleapi
    opt: paths=source_relative
